[project]
name = "sanchay"
version = "0.1.0"
description = "Regret-aware storage intelligence for Linux"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["prompt-toolkit>=3.0,<4"]

[project.optional-dependencies]
tui = ["textual>=1.0"]
viz = ["plotly>=5.20", "pandas>=2.0"]
ai = ["anthropic>=0.40"]
all = ["textual>=1.0", "plotly>=5.20", "pandas>=2.0", "anthropic>=0.40"]

[project.scripts]
sanchay = "sanchay.cli:main"
sanchay-ui = "sanchay.tui:run"
sanchay-demo = "sanchay.demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sanchay*"]
