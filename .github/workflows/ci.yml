name: SANCHAY CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run unit and integration tests
      run: |
        python -m unittest discover tests

    - name: Verify CLI scan
      run: |
        python -m sanchay.cli . --limit 5

    - name: Verify interactive shell on Linux
      run: |
        printf '/scan tests\n/status\n/permissions status\n/exit\n' | python -m sanchay.cli

    - name: Rehearse final-round safety proof
      run: |
        python -m sanchay.demo --prove
        python -m sanchay.demo --risk-prove
